# =============================================================
# Viva+ — Configuração do Decap CMS
#
# Painel de administração em /admin, sem servidor próprio e
# sem banco de dados: cada alteração aqui vira um commit no
# repositório Git do site. Veja o README (seção "Painel de
# administração") para o passo a passo de configuração.
# =============================================================

backend:
  name: git-gateway   # veja o README para alternativas (ex.: backend "github")
  branch: main        # troque se a branch principal do seu repositório tiver outro nome

# Permite testar o painel no seu computador antes de publicar,
# rodando `npx decap-server` (veja o README). Só tem efeito
# quando o admin é acessado em localhost — pode deixar como
# está mesmo depois de publicar o site.
local_backend: true

# Identidade do painel: logo na tela de login e link "Ver site"
# no topo. O visual do painel em si fica em admin/tema.css, e as
# pré-visualizações (com o visual do site) em admin/previews.js.
logo_url: "/assets/images/logoviva.png"
site_url: "https://vivaplus.netlify.app"
display_url: "https://vivaplus.netlify.app"

# Pasta padrão para uploads (aba "Mídia"). Cada campo de imagem
# abaixo define a sua própria subpasta (colaboradores/ ou projetos/)
# — veja o "media_folder" dentro de cada campo "widget: image".
#
# IMPORTANTE: caminhos de media_folder/public_folder DENTRO de um
# campo são resolvidos a partir da pasta do arquivo da coleção
# (aqui, "data/"), não a partir da raiz do site — por isso começam
# com "/": isso os torna absolutos, contados a partir da raiz do
# repositório/site. Já o media_folder global (abaixo) é contado a
# partir da raiz do repositório e não leva a barra inicial.
media_folder: "assets/images"
public_folder: "/assets/images"

locale: "pt"

# Nomes de arquivo dos novos colaboradores/projetos: sem acento e sem
# espaços (ex.: "Thayná Brandão" vira thayna-brandao.json).
slug:
  encoding: "ascii"
  clean_accents: true

# Menu do painel: primeiro o que se edita com frequência. Setores, Metas
# e Orientações são arquivos únicos, agrupados em "Conteúdo do site".
collections:
  - name: "colaboradores"
    label: "Colaboradores"
    label_singular: "Colaborador"
    description: "Pessoas exibidas na seção “Colaboradores” e nos modais de cada setor."
    folder: "data/colaboradores"
    extension: "json"
    format: "json"
    create: true
    identifier_field: "nome"
    slug: "{{nome}}"
    summary: "{{setorId}} · {{nome}} — {{cargo}}"
    sortable_fields: ["nome", "setorId", "cargo"]
    view_groups:
      - { label: "Setor", field: "setorId" }
    fields:
      - label: "Nome completo"
        name: "nome"
        widget: "string"

      - label: "Setor"
        name: "setorId"
        widget: "relation"
        collection: "conteudo"
        file: "setores"
        search_fields: ["setores.*.nome"]
        value_field: "setores.*.id"
        display_fields: ["setores.*.nome"]

      - label: "Cargo"
        name: "cargo"
        widget: "string"
        required: false
        default: "Informações em breve"
        hint: "Quem tem Gestor(a) ou Diretor(a) no cargo aparece primeiro no setor."

      - label: "Foto"
        name: "foto"
        widget: "image"
        required: false
        media_folder: "/assets/images/colaboradores"
        public_folder: "/assets/images/colaboradores"

  - name: "projetos"
    label: "Projetos e atividades"
    label_singular: "Projeto"
    description: "Cards e timeline da seção “Projetos & atividades”."
    folder: "data/projetos"
    extension: "json"
    format: "json"
    create: true
    identifier_field: "titulo"
    slug: "{{titulo}}"
    summary: "{{titulo}} — {{categoria}}"
    sortable_fields: ["titulo", "categoria"]
    view_groups:
      - { label: "Categoria", field: "categoria" }
    fields:
      - label: "Título"
        name: "titulo"
        widget: "string"

      - label: "Descrição"
        name: "descricao"
        widget: "text"
        default: "Descrição em breve."

      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - { label: "Realizado", value: "Realizado" }
          - { label: "Em andamento", value: "Em andamento" }

      - label: "Data"
        name: "data"
        widget: "datetime"
        format: "DD/MM/YYYY"
        date_format: "DD/MM/YYYY"
        time_format: false
        default: ""
        required: false
        hint: "Em branco, o site mostra “Em breve”."

      # Para criar uma categoria, adicione uma linha nesta lista.
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        options:
          - "Ambiente"
          - "Carreira"
          - "Comunidade"
          - "Conscientização"
          - "Direitos Humanos"
          - "Educação"
          - "Educação e Social"
          - "Inclusão"
          - "Institucional"
          - "Saúde"
          - "Saúde e Tecnologia"
          - "Saúde Mental"
          - "Visão"

      - label: "Setores"
        name: "setoresIds"
        widget: "relation"
        collection: "conteudo"
        file: "setores"
        search_fields: ["setores.*.nome"]
        value_field: "setores.*.id"
        display_fields: ["setores.*.nome"]
        multiple: true
        required: false
        hint: "Os nomes aparecem no card, e o projeto entra no filtro de cada setor marcado. Sem setor, o card mostra “Viva+”."

      - label: "Projeto geral da Viva+"
        name: "geral"
        widget: "boolean"
        default: false
        required: false
        hint: "Inclui o projeto no filtro “Viva+”. Pode ser marcado junto com setores."

      - label: "Imagem de capa"
        name: "imagem"
        widget: "image"
        required: false
        media_folder: "/assets/images/projetos"
        public_folder: "/assets/images/projetos"
        hint: "Em branco, o card usa a primeira foto da galeria."

      - label: "Fotos adicionais (galeria)"
        name: "galeria"
        widget: "list"
        required: false
        minimize_collapsed: true
        label_singular: "foto"
        hint: "Com mais de uma foto, o card ganha o botão “Ver fotos”. Arraste para mudar a ordem."
        field:
          label: "Foto"
          name: "foto"
          widget: "image"
          media_folder: "/assets/images/projetos"
          public_folder: "/assets/images/projetos"

  - name: "conteudo"
    label: "Conteúdo do site"
    description: "Metas, orientações e os dados de cada setor."
    files:
      - name: "metas"
        label: "Metas por setor"
        file: "data/metas.json"
        format: "json"
        fields:
          - label: "Progresso por setor"
            name: "progresso"
            widget: "list"
            label_singular: "Setor"
            summary: "{{fields.setor}} — {{fields.percentual}}%"
            hint: "Mantenha um item por setor. Setor sem item aparece com 30% no site."
            fields:
              - label: "Setor"
                name: "setor"
                widget: "relation"
                collection: "conteudo"
                file: "setores"
                search_fields: ["setores.*.nome"]
                value_field: "setores.*.id"
                display_fields: ["setores.*.nome"]

              - label: "Percentual concluído"
                name: "percentual"
                widget: "number"
                value_type: "int"
                min: 0
                max: 100

              - label: "Metas do setor"
                name: "metas"
                widget: "list"
                label_singular: "Meta"
                summary: "{{fields.texto}}"
                fields:
                  - label: "Texto da meta"
                    name: "texto"
                    widget: "string"

                  - label: "Concluída"
                    name: "concluida"
                    widget: "boolean"
                    default: false
                    hint: "A meta aparece riscada no site."

      - name: "orientacoes"
        label: "Orientações"
        file: "data/orientacoes.json"
        format: "json"
        fields:
          - label: "Significado de cada mês"
            name: "meses"
            widget: "list"
            label_singular: "Mês"
            summary: "{{fields.mes}} — {{fields.tema}}"
            hint: "O site destaca sozinho o mês atual. Mantenha um item por mês."
            fields:
              - label: "Mês"
                name: "mes"
                widget: "select"
                options:
                  - { label: "01 — Janeiro", value: 1 }
                  - { label: "02 — Fevereiro", value: 2 }
                  - { label: "03 — Março", value: 3 }
                  - { label: "04 — Abril", value: 4 }
                  - { label: "05 — Maio", value: 5 }
                  - { label: "06 — Junho", value: 6 }
                  - { label: "07 — Julho", value: 7 }
                  - { label: "08 — Agosto", value: 8 }
                  - { label: "09 — Setembro", value: 9 }
                  - { label: "10 — Outubro", value: 10 }
                  - { label: "11 — Novembro", value: 11 }
                  - { label: "12 — Dezembro", value: 12 }

              - label: "Tema / campanha do mês"
                name: "tema"
                widget: "string"
                hint: "Ex.: “Janeiro Branco”, “Outubro Rosa”."

              - label: "Texto explicativo"
                name: "texto"
                widget: "text"

          - label: "Dicas rápidas"
            name: "dicas"
            widget: "list"
            label_singular: "Dica"
            summary: "{{fields.titulo}}"
            fields:
              - label: "Título"
                name: "titulo"
                widget: "string"

              - label: "Categoria"
                name: "categoria"
                widget: "select"
                hint: "Define a etiqueta do card e o filtro em que ele aparece."
                options:
                  - { label: "Hidratação", value: "hidratacao" }
                  - { label: "Alimentação", value: "alimentacao" }
                  - { label: "Atividade física", value: "atividade-fisica" }
                  - { label: "Sono", value: "sono" }
                  - { label: "Postura", value: "postura" }
                  - { label: "Saúde mental", value: "saude-mental" }
                  - { label: "Outros", value: "outro" }

              - label: "Texto"
                name: "texto"
                widget: "text"

      - name: "setores"
        label: "Setores"
        file: "data/setores.json"
        format: "json"
        fields:
          - label: "Setores"
            name: "setores"
            widget: "list"
            label_singular: "Setor"
            summary: "{{fields.numero}} — {{fields.nome}}"
            fields:
              - label: "Id"
                name: "id"
                widget: "string"
                pattern: ["^[a-z0-9-]+$", "Use só letras minúsculas, números e hífen."]
                hint: "Não altere o id de um setor existente: outras partes do site e o agente de carreira dependem dele."

              - label: "Número"
                name: "numero"
                widget: "string"
                hint: "Ex.: 07. Aparece no modal do setor."

              - label: "Nome"
                name: "nome"
                widget: "string"

              - label: "Nome curto (filtros)"
                name: "nomeCurto"
                widget: "string"
                required: false
                hint: "Ex.: RH. Em branco, os filtros usam o nome completo."

              - label: "Ícone"
                name: "icone"
                widget: "select"
                required: false
                default: "geral"
                hint: "Aparece no organograma e no modal."
                options:
                  - { label: "Genérico (quadrados)", value: "geral" }
                  - { label: "Estrela", value: "estrela" }
                  - { label: "Pessoas", value: "pessoas" }
                  - { label: "Capelo (formação)", value: "capelo" }
                  - { label: "Escudo (segurança)", value: "escudo" }
                  - { label: "Balão de conversa", value: "balao" }
                  - { label: "Aperto de mão", value: "aperto" }
                  - { label: "Monitor (tecnologia)", value: "monitor" }

              - label: "Cor"
                name: "corAccent"
                widget: "select"
                hint: "Cor do card e do ícone do setor."
                options:
                  - { label: "Azul", value: "var(--color-blue)" }
                  - { label: "Verde", value: "var(--color-green)" }
                  - { label: "Laranja", value: "var(--color-orange)" }

              - label: "Resumo"
                name: "resumo"
                widget: "string"
                hint: "Uma frase curta, exibida no card do setor."

              - label: "Função / Objetivo"
                name: "objetivo"
                widget: "list"
                required: false
                minimize_collapsed: true
                label_singular: "Item"
                field: { label: "Item", name: "item", widget: "string" }
