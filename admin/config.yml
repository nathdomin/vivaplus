# =============================================================
# Viva+ — Configuração do Decap CMS
#
# Painel de administração em /admin, sem servidor próprio e
# sem banco de dados: cada alteração aqui vira um commit no
# repositório Git do site. Veja o README (seção "Painel de
# administração") para o passo a passo de configuração.
# =============================================================

backend:
  name: git-gateway   # veja o README para alternativas (ex.: backend "github")
  branch: main        # troque se a branch principal do seu repositório tiver outro nome

# Permite testar o painel no seu computador antes de publicar,
# rodando `npx decap-server` (veja o README). Só tem efeito
# quando o admin é acessado em localhost — pode deixar como
# está mesmo depois de publicar o site.
local_backend: true

# Identidade do painel: logo na tela de login e link "Ver site"
# no topo. O visual do painel em si fica em admin/tema.css, e as
# pré-visualizações (com o visual do site) em admin/previews.js.
logo_url: "/assets/images/logoviva.png"
site_url: "https://vivaplus.netlify.app"
display_url: "https://vivaplus.netlify.app"

# Pasta padrão para uploads (aba "Mídia"). Cada campo de imagem
# abaixo define a sua própria subpasta (colaboradores/ ou projetos/)
# — veja o "media_folder" dentro de cada campo "widget: image".
#
# IMPORTANTE: caminhos de media_folder/public_folder DENTRO de um
# campo são resolvidos a partir da pasta do arquivo da coleção
# (aqui, "data/"), não a partir da raiz do site — por isso começam
# com "/": isso os torna absolutos, contados a partir da raiz do
# repositório/site. Já o media_folder global (abaixo) é contado a
# partir da raiz do repositório e não leva a barra inicial.
media_folder: "assets/images"
public_folder: "/assets/images"

locale: "pt"

collections:
  - name: "setores"
    label: "Setores"
    description: "Setores exibidos no organograma, nos cards e nos modais do site. O agente de carreira (VivAIplus) lê este mesmo arquivo para recomendar setores aos candidatos."
    files:
      - name: "setores"
        label: "Lista de setores"
        file: "data/setores.json"
        format: "json"
        fields:
          - label: "Setores"
            name: "setores"
            widget: "list"
            label_singular: "Setor"
            summary: "{{fields.numero}} — {{fields.nome}}"
            fields:
              - label: "Id"
                name: "id"
                widget: "string"
                pattern: ["^[a-z0-9-]+$", "Use só letras minúsculas, números e hífen."]
                hint: "Identificador interno (ex.: rh). Não altere o id de um setor existente: colaboradores, projetos, metas e o agente de carreira dependem dele."

              - label: "Número"
                name: "numero"
                widget: "string"
                hint: "Ex.: 07. Exibido no organograma e nos cards."

              - label: "Nome"
                name: "nome"
                widget: "string"

              - label: "Nome curto (filtros)"
                name: "nomeCurto"
                widget: "string"
                required: false
                hint: "Rótulo dos botões de filtro de Colaboradores e Projetos (ex.: RH, T&D). Em branco, usa o nome completo."

              - label: "Ícone"
                name: "icone"
                widget: "select"
                required: false
                default: "geral"
                hint: "Ícone exibido no card e no modal do setor."
                options:
                  - { label: "Genérico (quadrados)", value: "geral" }
                  - { label: "Estrela", value: "estrela" }
                  - { label: "Pessoas", value: "pessoas" }
                  - { label: "Capelo (formação)", value: "capelo" }
                  - { label: "Escudo (segurança)", value: "escudo" }
                  - { label: "Balão de conversa", value: "balao" }
                  - { label: "Aperto de mão", value: "aperto" }
                  - { label: "Monitor (tecnologia)", value: "monitor" }

              - label: "Cor de destaque"
                name: "corAccent"
                widget: "select"
                hint: "Cor do ícone do setor e da faixa lateral do card de metas."
                options:
                  - { label: "Azul", value: "var(--color-blue)" }
                  - { label: "Verde", value: "var(--color-green)" }
                  - { label: "Laranja", value: "var(--color-orange)" }
                  - { label: "Gradiente azul → verde", value: "linear-gradient(135deg, var(--color-blue), var(--color-green))" }
                  - { label: "Gradiente azul → laranja", value: "linear-gradient(135deg, var(--color-blue), var(--color-orange))" }

              - label: "Resumo"
                name: "resumo"
                widget: "string"
                hint: "Uma frase curta, exibida no card do setor."

              - label: "Função / Objetivo"
                name: "objetivo"
                widget: "list"
                required: false
                minimize_collapsed: true
                label_singular: "Item"
                field: { label: "Item", name: "item", widget: "string" }

              - label: "Atividades"
                name: "atividades"
                widget: "list"
                required: false
                minimize_collapsed: true
                label_singular: "Atividade"
                field: { label: "Atividade", name: "atividade", widget: "string" }

              - label: "Competências desejáveis (só para o agente)"
                name: "competencias"
                widget: "list"
                required: false
                minimize_collapsed: true
                label_singular: "Competência"
                hint: "Não aparece no site. O agente de carreira compara com o currículo. Ex.: “Comunicação escrita”, “Excel intermediário”."
                field: { label: "Competência", name: "competencia", widget: "string" }

              - label: "Requisitos essenciais (só para o agente)"
                name: "requisitos"
                widget: "list"
                required: false
                minimize_collapsed: true
                label_singular: "Requisito"
                hint: "Não aparece no site. Requisitos técnicos obrigatórios para o agente recomendar o setor."
                field: { label: "Requisito", name: "requisito", widget: "string" }

  - name: "colaboradores"
    label: "Colaboradores"
    description: "Time exibido na seção “Colaboradores” do site e nos modais de cada setor."
    files:
      - name: "colaboradores"
        label: "Lista de colaboradores"
        file: "data/colaboradores.json"
        format: "json"
        fields:
          - label: "Colaboradores"
            name: "colaboradores"
            widget: "list"
            label_singular: "Colaborador"
            summary: "{{fields.setorId}} · {{fields.nome}} — {{fields.cargo}}"
            hint: "Cada item começa pelo setor. Ao adicionar alguém, arraste o item para junto do restante do setor: a ordem desta lista é a ordem do filtro “Todos” no site."
            fields:
              - label: "Nome completo"
                name: "nome"
                widget: "string"

              - label: "Setor"
                name: "setorId"
                widget: "relation"
                collection: "setores"
                file: "setores"
                search_fields: ["setores.*.nome"]
                value_field: "setores.*.id"
                display_fields: ["setores.*.nome"]
                hint: "A lista mostra os setores cadastrados na coleção “Setores”. Se o setor de uma pessoa foi apagado, escolha o novo setor aqui."

              - label: "Cargo"
                name: "cargo"
                widget: "string"
                required: false
                default: "Informações em breve"
                hint: "Deixe em branco para manter \"Informações em breve\"."

              - label: "Foto"
                name: "foto"
                widget: "image"
                required: false
                media_folder: "/assets/images/colaboradores"
                public_folder: "/assets/images/colaboradores"
                hint: "Enviada automaticamente para assets/images/colaboradores/."

  - name: "projetos"
    label: "Projetos e atividades"
    description: "Cards e timeline da seção “Projetos & atividades” do site."
    files:
      - name: "projetos"
        label: "Lista de projetos"
        file: "data/projetos.json"
        format: "json"
        fields:
          - label: "Projetos"
            name: "projetos"
            widget: "list"
            label_singular: "Projeto"
            summary: "{{fields.titulo}} — {{fields.status}}"
            fields:
              - label: "Título"
                name: "titulo"
                widget: "string"

              - label: "Setor exibido no card"
                name: "setor"
                widget: "string"
                hint: "Texto livre, mostrado no card. Ex.: “Comercial”, “Viva+”, “Geral”."

              - label: "Setor (filtro)"
                name: "setorId"
                widget: "relation"
                collection: "setores"
                file: "setores"
                search_fields: ["setores.*.nome"]
                value_field: "setores.*.id"
                display_fields: ["setores.*.nome"]
                required: false
                hint: "Usado para o botão de filtro. Deixe em branco para um projeto geral (sem setor): ele aparece só em “Todos”. A lista mostra os setores cadastrados na coleção “Setores”."

              - label: "Categoria"
                name: "categoria"
                widget: "string"
                hint: "Ex.: Saúde, Integração, Institucional."

              - label: "Data"
                name: "data"
                widget: "string"
                default: "Em breve"
                hint: "Texto livre — ex.: “10/2026” ou “Em breve”."

              - label: "Imagem"
                name: "imagem"
                widget: "image"
                required: false
                media_folder: "/assets/images/projetos"
                public_folder: "/assets/images/projetos"
                hint: "Enviada automaticamente para assets/images/projetos/. Se ficar em branco, o card mostra “Imagem em breve”."

              - label: "Descrição"
                name: "descricao"
                widget: "text"
                default: "Descrição em breve."

              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - { label: "Realizado", value: "Realizado" }
                  - { label: "Em andamento", value: "Em andamento" }

  - name: "metas"
    label: "Metas por setor"
    description: "Percentual e lista de metas de cada setor, na seção “Metas” do site e no modal do organograma."
    files:
      - name: "metas"
        label: "Progresso das metas"
        file: "data/metas.json"
        format: "json"
        fields:
          - label: "Progresso por setor"
            name: "progresso"
            widget: "list"
            label_singular: "Setor"
            summary: "{{fields.setor}} — {{fields.percentual}}%"
            hint: "Mantenha só um item por setor. Se um setor não tiver item aqui, o site mostra 30% como valor padrão."
            fields:
              - label: "Setor"
                name: "setor"
                widget: "relation"
                collection: "setores"
                file: "setores"
                search_fields: ["setores.*.nome"]
                value_field: "setores.*.id"
                display_fields: ["setores.*.nome"]
                hint: "A lista mostra os setores cadastrados na coleção “Setores”."

              - label: "Percentual concluído"
                name: "percentual"
                widget: "number"
                value_type: "int"
                min: 0
                max: 100
                hint: "Um número de 0 a 100. Ex.: 55 para 55%."

              - label: "Metas do setor"
                name: "metas"
                widget: "list"
                label_singular: "Meta"
                summary: "{{fields.texto}}"
                hint: "As metas exibidas no card do setor (seção “Metas”) e no modal do organograma. Marque “Concluída” para a meta aparecer riscada no site."
                fields:
                  - label: "Texto da meta"
                    name: "texto"
                    widget: "string"

                  - label: "Concluída"
                    name: "concluida"
                    widget: "boolean"
                    default: false
                    hint: "Marque quando a meta já tiver sido alcançada — ela aparece riscada no site, sem ser removida da lista."

  - name: "orientacoes"
    label: "Orientações"
    description: "Conteúdo da seção “Orientações” do site: o significado de cada mês (destaque automático do mês atual) e as dicas rápidas de bem-estar (hidratação, sono, postura etc.)."
    files:
      - name: "orientacoes"
        label: "Orientações"
        file: "data/orientacoes.json"
        format: "json"
        fields:
          - label: "Significado de cada mês"
            name: "meses"
            widget: "list"
            label_singular: "Mês"
            summary: "{{fields.nome}} — {{fields.tema}}"
            hint: "O site mostra automaticamente, em destaque, o item cujo campo “Mês (número)” corresponder ao mês atual do calendário. Mantenha só um item por número de mês."
            fields:
              - label: "Mês (número)"
                name: "mes"
                widget: "select"
                options:
                  - { label: "01 — Janeiro", value: 1 }
                  - { label: "02 — Fevereiro", value: 2 }
                  - { label: "03 — Março", value: 3 }
                  - { label: "04 — Abril", value: 4 }
                  - { label: "05 — Maio", value: 5 }
                  - { label: "06 — Junho", value: 6 }
                  - { label: "07 — Julho", value: 7 }
                  - { label: "08 — Agosto", value: 8 }
                  - { label: "09 — Setembro", value: 9 }
                  - { label: "10 — Outubro", value: 10 }
                  - { label: "11 — Novembro", value: 11 }
                  - { label: "12 — Dezembro", value: 12 }

              - label: "Nome do mês"
                name: "nome"
                widget: "string"
                hint: "Ex.: “Janeiro”. Usado como texto de apoio no card."

              - label: "Tema / campanha do mês"
                name: "tema"
                widget: "string"
                hint: "Ex.: “Janeiro Branco”, “Outubro Rosa”. Aparece em destaque no card."

              - label: "Texto explicativo"
                name: "texto"
                widget: "text"
                hint: "Um parágrafo curto explicando o significado do mês para quem visita o site."

          - label: "Dicas rápidas"
            name: "dicas"
            widget: "list"
            label_singular: "Dica"
            summary: "{{fields.titulo}}"
            hint: "Cards de orientações gerais de bem-estar (beber água, sono, postura etc.), exibidos em grade e filtráveis por categoria."
            fields:
              - label: "Título"
                name: "titulo"
                widget: "string"
                hint: "Ex.: “Beba água ao longo do dia”."

              - label: "Categoria"
                name: "categoria"
                widget: "select"
                hint: "Define o ícone do card e o filtro em que ele aparece."
                options:
                  - { label: "Hidratação", value: "hidratacao" }
                  - { label: "Alimentação", value: "alimentacao" }
                  - { label: "Atividade física", value: "atividade-fisica" }
                  - { label: "Sono", value: "sono" }
                  - { label: "Postura", value: "postura" }
                  - { label: "Saúde mental", value: "saude-mental" }
                  - { label: "Outros", value: "outro" }

              - label: "Texto"
                name: "texto"
                widget: "text"
                hint: "Um parágrafo curto com a orientação completa."
